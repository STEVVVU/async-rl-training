name: Local CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native_fence_integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAY_ADDRESS: local
      PYTHONPATH: .:./skyrl-gym
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
      - name: Install locked CPU test environment and exercise native trainer
        run: |
          set -euo pipefail
          {
            uv run --isolated --no-project --python 3.12 -- uv export --frozen --extra skyrl-train --extra dev --no-emit-project \
              | awk '/^[^[:space:]#]/{skip=($0 ~ /^(-e \.\/skyrl-gym|flash-attn|nixl|nvidia-|cuda-|triton==|quack-kernels|torch==|torch-c-dlpack-ext)/)} !skip' \
              > native-cpu-requirements.txt
            echo 'torch @ https://download-r2.pytorch.org/whl/cpu/torch-2.13.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl --hash=sha256:4ca4a9394b0c771238a4f73590fdbbc4debad85ed0fa63d026ae1b085da7d6e2' >> native-cpu-requirements.txt
            uv run --isolated --no-project --python 3.12 -- uv venv "$RUNNER_TEMP/native-fence"
            timeout 20m uv run --isolated --no-project --python 3.12 -- uv --no-config pip sync \
              --python "$RUNNER_TEMP/native-fence/bin/python" --require-hashes \
              native-cpu-requirements.txt
            timeout 2m uv run --isolated --no-project --python 3.12 -- "$RUNNER_TEMP/native-fence/bin/python" -c \
              'import ray, torch, torchdata; from skyrl.train.fully_async_trainer import FullyAsyncRayPPOTrainer; assert torch.version.cuda is None; print("actual trainer import:", FullyAsyncRayPPOTrainer, "torch:", torch.__version__, "ray:", ray.__version__, "torchdata:", torchdata.__version__)'
            timeout 10m uv run --isolated --no-project --python 3.12 -- "$RUNNER_TEMP/native-fence/bin/python" -m pytest \
              --basetemp "$RUNNER_TEMP/native-fence-tests" -v -s tests/train/test_fully_async_trainer.py
          } 2>&1 | tee native-fence-integration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-fence-integration-log
          path: |
            native-fence-integration.log
            native-cpu-requirements.txt
            ${{ runner.temp }}/native-fence-tests/
          if-no-files-found: warn

  local_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
      - name: Dependency-free behavioral checks
        env:
          PYTHONPATH: .
        run: uv run --isolated --no-project python -m unittest discover -s tests/local_async -v
      - name: Lint changed Python modules
        run: >-
          uv run --isolated --no-project --with ruff==0.11.9 ruff check
          skyrl/train/staleness.py skyrl/train/trainer.py skyrl/train/fully_async_trainer.py
          skyrl/train/config/config.py tests/local_async tests/local_async_torch tests/train/test_fully_async_trainer.py
          scripts/verify_async_rl.py scripts/verify_head_quality.py scripts/verify_fresh_head_holdout.py examples/local_async
      - name: Check formatting
        run: >-
          uv run --isolated --no-project --with black==24.10.0 black --check
          skyrl/train/staleness.py skyrl/train/trainer.py skyrl/train/fully_async_trainer.py
          skyrl/train/config/config.py tests/local_async tests/local_async_torch tests/train/test_fully_async_trainer.py
          scripts/verify_async_rl.py scripts/verify_head_quality.py scripts/verify_fresh_head_holdout.py examples/local_async
      - name: Compile reference and drivers without importing model dependencies
        run: uv run --isolated --no-project python -m compileall -q scripts/verify_async_rl.py scripts/verify_head_quality.py scripts/verify_fresh_head_holdout.py examples/local_async
      - name: Check fresh-holdout protocol without loading a model
        run: uv run --isolated --no-project python -m unittest discover -s tests/local_async_torch -p test_fresh_head_holdout.py -v
      - name: Verify retained head-quality evidence without loading a model
        run: |
          uv run --isolated --no-project python - <<'PY'
          import hashlib
          import json
          import math
          from pathlib import Path

          root = Path('docs/evidence/head-quality-20261024')
          hashes = json.loads((root / 'sha256.json').read_text())
          for name, digest in hashes.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
          raw = json.loads((root / 'raw-sha256.json').read_text())
          for name, item in raw.items():
              data = (root / name).read_bytes()
              if item['line_endings'] == 'crlf':
                  data = data.replace(b'\n', b'\r\n')
              assert hashlib.sha256(data).hexdigest() == item['sha256'], name
          training = json.loads((root / 'training.json').read_text())
          selection = json.loads((root / 'selection.json').read_text())
          test = json.loads((root / 'test.json').read_text())
          assert selection['training_sha256'] == raw['training.json']['sha256']
          assert test['selection_sha256'] == raw['selection.json']['sha256']
          for name, path in [('train.py', 'examples/local_async/train.py'), ('driver.py', 'scripts/verify_head_quality.py')]:
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == selection['source'][name]
          expected = {f'{arm}-seed-{seed}' for arm in ('clipped', 'unclipped') for seed in (11, 23, 37, 51, 71)}
          assert set(training['runs']) == set(selection['selections']) == set(test['results']) == expected
          checkpoints = {}
          for name, run in training['runs'].items():
              assert [x['step'] for x in run['updates'] if 'loss' in x] == list(range(1, 257))
              candidates = [{'step': 0, **run['initial_validation'], 'checkpoint': None}]
              measured = [x for x in run['updates'] if 'validation' in x]
              assert [x['step'] for x in measured] == [32, 128, 256]
              for item in measured:
                  checkpoints[item['checkpoint']] = item['sha256']
                  candidates.append({**item['validation'], 'step': item['step'], 'checkpoint': item['checkpoint'], 'sha256': item['sha256']})
              assert max(candidates, key=lambda x: (x['expected_reward'], -x['step'])) == selection['selections'][name]
          assert checkpoints == json.loads((root / 'checkpoint-hashes.json').read_text())
          assert len(checkpoints) == 30
          assert test['cached_logit_oracle']['max_ulp'] <= 1
          assert all(value['max_ulp'] <= 1 for value in test['selection_logit_checks'].values())
          assert all(math.isfinite(value['expected_reward']) and 0 <= value['answer_success'] <= 1 for value in test['results'].values())
          print('Retained CPU/GPU receipts verified; this CI job did not run model training or CUDA.')
          root = Path('docs/evidence/fresh-head-holdout-20261024')
          for name, digest in json.loads((root / 'sha256.json').read_text()).items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
          raw = json.loads((root / 'raw-sha256.json').read_text())
          for name, identity in raw.items():
              data = (root / name).read_bytes()
              if identity['line_endings'] == 'crlf':
                  data = data.replace(b'\n', b'\r\n')
              assert hashlib.sha256(data).hexdigest() == identity['sha256'], name
          frozen = json.loads((root / 'freeze.json').read_text())
          fresh = json.loads((root / 'test.json').read_text())
          assert fresh['freeze_sha256'] == raw['freeze.json']['sha256']
          assert frozen['selection_sha256'] == fresh['selection_sha256'] == test['selection_sha256']
          assert frozen['selected_heads'] == selection['selections']
          import random
          pairs = [[a, b] for a in range(10, 100) for b in range(a, 100)]
          random.Random(20261024).shuffle(pairs)
          assert frozen['protocol']['pairs'] == pairs[:256]
          assert set(fresh['results']) == set(fresh['oracle_checks']) == expected | {'initial'}
          for name, result in fresh['results'].items():
              rows = result['per_pair']
              assert [row['pair'] for row in rows] == pairs[:256]
              for metric in ('answer_success', 'expected_reward'):
                  assert all(math.isfinite(row[metric]) for row in rows)
                  total = 0.0
                  for row in rows:
                      total += row[metric]
                  assert total / 256 == result[metric]
              assert fresh['oracle_checks'][name]['max_ulp'] <= 1
          assert fresh['oracle_pair_indices'] == list(range(16))
          for name, path in [('reference_train', 'examples/local_async/train.py'), ('head_quality_driver', 'scripts/verify_head_quality.py'), ('fresh_holdout_driver', 'scripts/verify_fresh_head_holdout.py')]:
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == frozen['source_sha256'][name]
          print('Fresh 256-pair holdout receipts verified; model evaluation ran separately on the recorded GPU.')
          PY
      - name: State verification limits
        run: |
          echo 'CPU unit and static checks only. No pretrained model or native distributed backend runs in this job.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The artifact contains retained measurements from a separate October 21, 2026 CUDA run. Heldout reward decreased.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: retained-pretrained-reference-measurements
          path: verification/pretrained-reference/
          if-no-files-found: error
